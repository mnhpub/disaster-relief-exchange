name = "disaster-relief-exchange"
type = "service"
main = "dist/index.js"
compatibility_date = "2024-12-17"

[env.production]
routes = [
  { pattern = "api.disaster-relief.local", zone_name = "disaster-relief.local" }
]

[env.development]
routes = [
  { pattern = "localhost:8787" }
]

[[d1_databases]]
binding = "DB"
database_name = "disaster-relief"
database_id = "12345678-1234-1234-1234-123456789012"
preview_database_id = "preview-12345678-1234-1234-1234-123456789012"

[env.development.d1_databases]
binding = "DB"
database_name = "disaster-relief-dev"
database_id = "dev-12345678-1234-1234-1234-123456789012"
preview_database_id = "dev-12345678-1234-1234-1234-123456789012"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "disaster-relief-assets"

[env.development.r2_buckets]
binding = "ASSETS"
bucket_name = "disaster-relief-assets-dev"

[triggers]
crons = ["0 0 * * *"]

[build]
command = "bun run build"

[build.upload]
format = "service-worker"
